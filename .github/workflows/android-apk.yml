name: Crear APK interno de MyM Campo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Preparar archivos sin conexión
        run: npm run build:web
      - name: Crear proyecto Android
        run: npx cap add android
      - name: Configurar logo de caña
        run: node scripts/configure-android.mjs
      - name: Sincronizar archivos de la app
        run: npx cap sync android
      - name: Construir APK interno
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Guardar APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: MyM-Campo-APK-interno
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
